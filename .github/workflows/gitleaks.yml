name: gitleaks
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
jobs:
  scan:
    name: gitleaks
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      # Also selects the version gitleaks-action downloads, so the canary
      # verifies the same engine and configuration.
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Verify Gitleaks rules are active
        run: bash .github/scripts/gitleaks-ci.sh canary
      # gitleaks-action rejects merge_group events; scan the group's commits
      # from the target branch with the CLI instead.
      - name: Scan merge group
        if: ${{ github.event_name == 'merge_group' }}
        env:
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          case "$BASE_REF" in
            refs/heads/?*) branch="${BASE_REF#refs/heads/}" ;;
            *) echo "::error::Unexpected merge group base ref: $BASE_REF"; exit 1 ;;
          esac
          git fetch --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          bash .github/scripts/gitleaks-ci.sh merge-group "refs/remotes/origin/$branch" "$HEAD_SHA"
      - uses: gitleaks/gitleaks-action@v2
        if: ${{ github.event_name != 'merge_group' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} 
