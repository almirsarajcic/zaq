name: Protect opencode workflow

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

env:
  ZAQ_ALLOWED_ROLES: maintain,admin
  ZAQ_PROTECTED_FILES: .github/workflows/opencode.yml,.github/workflows/protect-opencode-workflow.yml,.github/CODEOWNERS

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce-protected-files:
    runs-on: ubuntu-latest
    steps:
      # Tested by .github/scripts/protect-opencode-workflow.test.js, which runs
      # this script as written here.
      - name: Enforce maintainer-only changes to protected files
        uses: actions/github-script@v8
        env:
          ZAQ_ALLOWED_ROLES: ${{ env.ZAQ_ALLOWED_ROLES }}
          ZAQ_PROTECTED_FILES: ${{ env.ZAQ_PROTECTED_FILES }}
        with:
          script: |
            const allowedRoles = (process.env.ZAQ_ALLOWED_ROLES || "")
              .split(",")
              .map((role) => role.trim().toLowerCase())
              .filter(Boolean);

            const protectedFiles = (process.env.ZAQ_PROTECTED_FILES || "")
              .split(",")
              .map((file) => file.trim())
              .filter(Boolean);

            if (allowedRoles.length === 0 || protectedFiles.length === 0) {
              core.setFailed("Guard configuration is empty. Set ZAQ_ALLOWED_ROLES and ZAQ_PROTECTED_FILES.");
              return;
            }

            const { owner, repo } = context.repo;

            // The pull request files API lists at most 3000 files.
            const maxListedFiles = 3000;

            // Returns a failure message, or null when the pull request may merge.
            async function checkPullRequest(pullRequest) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pullRequest.number,
                per_page: 100
              });

              if (files.length >= maxListedFiles || files.length < pullRequest.changed_files) {
                return `Cannot list every file changed by pull request #${pullRequest.number}; review it manually.`;
              }

              // A rename away from a protected path removes the protected file.
              const changedProtectedFiles = [...new Set(files
                .flatMap((file) => [file.filename, file.previous_filename])
                .filter((filename) => filename && protectedFiles.includes(filename)))];

              if (changedProtectedFiles.length === 0) {
                core.info(`Pull request #${pullRequest.number} changes no protected files.`);
                return null;
              }

              const username = pullRequest.user?.login || "";

              let role = "none";

              try {
                const response = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username
                });
                role = (response.data.role_name || "none").toLowerCase();
              } catch (error) {
                if (error.status === 404) {
                  core.info(`"${username}" is not a collaborator.`);
                } else {
                  core.warning(`Permission lookup failed for "${username}" (${error.status || "unknown"}).`);
                }
              }

              if (!allowedRoles.includes(role)) {
                return [
                  `Pull request #${pullRequest.number} modifies protected files: ${changedProtectedFiles.join(", ")}.`,
                  `PR author "${username}" has role "${role}".`,
                  `Only roles [${allowedRoles.join(", ")}] may change these files.`
                ].join(" ");
              }

              core.info(
                `Protected file changes in #${pullRequest.number} are allowed. PR author "${username}" has role "${role}".`
              );
              return null;
            }

            // A merge group contains its own pull request and every queue entry
            // ahead of it, and may merge on the result of its head entry alone.
            // Attribute each commit between the target branch and the group head
            // to a queued pull request and check every one of them.
            async function mergeGroupPullRequests(group) {
              const branch = /^refs\/heads\/(.+)$/.exec(group?.base_ref || "")?.[1];
              if (!branch || !group.head_sha) {
                throw new Error("Merge group payload is missing its base ref or head SHA.");
              }

              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${branch}...${group.head_sha}`,
                per_page: 100
              });
              const commits = comparison.commits || [];

              if (
                comparison.status !== "ahead" ||
                commits.length === 0 ||
                commits.length !== comparison.total_commits ||
                commits[commits.length - 1].sha !== group.head_sha
              ) {
                throw new Error(
                  `Cannot list the merge group's commits from ${branch} (status "${comparison.status}", ` +
                    `${commits.length} of ${comparison.total_commits} commits).`
                );
              }

              const queue = await github.graphql(
                `query($owner: String!, $repo: String!, $branch: String!) {
                  repository(owner: $owner, name: $repo) {
                    mergeQueue(branch: $branch) {
                      entries(first: 100) {
                        totalCount
                        nodes { headCommit { oid } pullRequest { number } }
                      }
                    }
                  }
                }`,
                { owner, repo, branch }
              );
              const entries = queue?.repository?.mergeQueue?.entries;
              if (!entries || entries.totalCount > entries.nodes.length) {
                throw new Error(`Cannot read the ${branch} merge queue.`);
              }

              // Each entry's head commit ends the commits its pull request added.
              const numberByHead = new Map(entries.nodes
                .filter((entry) => entry.headCommit?.oid && entry.pullRequest?.number)
                .map((entry) => [entry.headCommit.oid, entry.pullRequest.number]));

              const numbers = [];
              let unattributed = 0;
              for (const commit of commits) {
                const number = numberByHead.get(commit.sha);
                if (number) {
                  numbers.push(number);
                  unattributed = 0;
                } else {
                  unattributed++;
                }
              }

              if (unattributed > 0) {
                throw new Error("Cannot attribute every merge group commit to a queued pull request.");
              }

              const pullRequests = [];
              for (const number of numbers) {
                const { data } = await github.rest.pulls.get({ owner, repo, pull_number: number });
                pullRequests.push(data);
              }
              return pullRequests;
            }

            let pullRequests;

            if (context.eventName === "pull_request_target") {
              if (!context.payload.pull_request) {
                core.setFailed("No pull request payload found.");
                return;
              }
              pullRequests = [context.payload.pull_request];
            } else if (context.eventName === "merge_group") {
              try {
                pullRequests = await mergeGroupPullRequests(context.payload.merge_group);
              } catch (error) {
                core.setFailed(`${error.message} Review this merge group manually.`);
                return;
              }
              core.info(`Merge group pull requests: ${pullRequests.map((pr) => `#${pr.number}`).join(", ")}.`);
            } else {
              core.setFailed(`Unsupported event "${context.eventName}".`);
              return;
            }

            const failures = [];
            for (const pullRequest of pullRequests) {
              const failure = await checkPullRequest(pullRequest);
              if (failure) failures.push(failure);
            }

            if (failures.length > 0) {
              core.setFailed(failures.join("\n"));
            }
